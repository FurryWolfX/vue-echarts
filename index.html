<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vue-echarts</title>
    <style>
      #app {
        height: 300px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from "vue";
      import * as echarts from "echarts";
      import VueEcharts from "./src/index.js";

      createApp({
        render() {
          return h(VueEcharts, {
            renderer: "svg",
            option: this.option,
            carousel: this.carousel
          });
        },
        data() {
          return {
            carousel: {
              interval: 2000,
              loopSeries: false,
              seriesIndex: 0
            },
            option: {
              tooltip: {
                trigger: "axis"
              },
              xAxis: {
                type: "category",
                boundaryGap: false,
                data: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
              },
              yAxis: {
                type: "value"
              },
              series: [
                {
                  data: [820, 932, 901, 934, 1290, 1330, 1320],
                  type: "line",
                  areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                      {
                        offset: 0,
                        color: "rgba(0,0,0,0)"
                      },
                      {
                        offset: 1,
                        color: "rgba(0,0,0,1)"
                      }
                    ])
                  }
                }
              ]
            }
          };
        }
      }).mount("#app");
    </script>
  </body>
</html>
